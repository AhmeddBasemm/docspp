# yaml-language-server: $schema=../diagram.schema.json
title: Photo uploads

groups:
  app: { label: Photo service, caption: Kubernetes }

nodes:
  browser: { kind: client, icon: react }
  api:     { kind: service, icon: nodejs, title: Upload API, in: app }
  store:   { kind: storage, icon: aws-s3, title: Storage, in: app }
  queue:   { kind: queue, icon: rabbitmq, title: Events, in: app }
  worker:  { kind: worker, icon: python, title: Thumbnailer, in: app }
  db:      { kind: database, icon: postgresql, title: Metadata, in: app }

edges:
  - browser -> api: POST /photos
  - api -> store: { kind: data, label: PUT }
  - api -> db: { kind: data, label: SQL }
  - api -> queue: { kind: queue, label: photo.uploaded }
  - queue -> worker: { kind: queue }
  - worker -> store: { kind: data, label: PUT }
  - worker -> db: { kind: data }

views:
  overview: { direction: DOWN }

scenarios:
  upload:
    title: Upload a photo
    steps:
      - browser -> api: POST /photos
      - api -> store: { label: PUT original, kind: lookup }
      - api -> queue: { label: photo.uploaded, kind: event }
      - api -> browser: 202 Accepted
      - queue -> worker: photo.uploaded
      - worker -> store: PUT thumbnails
      - worker -> db: { label: mark ready, kind: lookup }
