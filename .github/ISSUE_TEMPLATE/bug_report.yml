name: Bug report
description: Something is broken, wrong or confusing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A small reproduction gets a bug fixed fastest.
        For a security problem, please do **not** file it here: see [SECURITY.md](https://github.com/AhmeddBasemm/docspp/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: The smallest `diagram.yaml` (and page) that shows the problem, plus the steps. If the problem is a layout, say which view and scenario.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `docspp check --json`
      description: Leave empty if you have none.
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`docspp --version` is not needed; paste the versions from your package.json (docspp, @packagelab/docspp-astro, create-docspp) and your Node version."
      placeholder: "docspp 0.1.0, @packagelab/docspp-astro 0.1.0, Node 22.11"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS
